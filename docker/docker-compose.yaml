version: "3.9"

services:
  frontend:
    image: penpotapp/frontend:latest
    ports:
      - "80:80"
    environment:
      - PENPOT_FLAGS=enable-registration enable-login enable-demo
    depends_on:
      - backend

  backend:
    image: penpotapp/backend:latest
    environment:
      - PENPOT_FLAGS=enable-registration enable-login enable-demo
      - PENPOT_REDIS_URI=redis://redis/0
      - PENPOT_PUBLIC_URI=http://localhost
    depends_on:
      - redis
      - exporter
      - renderer

  exporter:
    image: penpotapp/exporter:latest

  renderer:
    image: penpotapp/renderer:latest

  redis:
    image: redis:alpine
